name: Bug report
description: Something in the generator, detector, audit tool, or reproduction scripts is broken.
title: "[bug] "
labels: [bug, needs-triage]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands, inputs, and configuration.
      render: bash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      placeholder: git rev-parse HEAD
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Node.js version, and relevant package versions.
      render: text
