# The frozen detector snapshot (lightweight-detector/) is deliberately absent:
# its pinned requirements are part of the paper record and are hash-verified.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directories:
      - /tools/PDFautogenerator
      - /tools/crackedpdfs-audit
    schedule:
      interval: weekly
    groups:
      python-tooling:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"
