name: Paper artifact CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            tools/PDFautogenerator/pyproject.toml
            tools/crackedpdfs-audit/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: make smoke

  reproduce-results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: make reproduce-results
      - name: Compare reproduced paper table
        run: diff --strip-trailing-cr -u paper-v1/metrics/hard-setting-summary.csv reproduced-results/hard-setting-summary.csv
      - uses: actions/upload-artifact@v4
        with:
          name: reproduced-paper-results
          path: reproduced-results/
