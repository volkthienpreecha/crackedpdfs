[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crackedpdfs-payloads"
version = "0.1.0"
description = "Assemble a licensed, id-tagged, near-duplicate-clustered pool of prompt-injection payloads for CrackedPDFs v2."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "Karthik Subramanian", email = "winnerkarthik07@gmail.com" },
  { name = "Pukaphol Thienpreecha" },
]
keywords = ["prompt-injection", "benchmark", "dataset", "minhash", "provenance"]
dependencies = [
  "datasets>=2.19",
  "datasketch>=1.6",
  "langdetect>=1.0.9",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
crackedpdfs-payloads = "crackedpdfs_payloads.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
