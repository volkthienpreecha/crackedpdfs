model_name: hybrid
dataset_config: configs/dataset_hard_provenance.yaml
features_config: configs/features_hard_provenance.yaml
features_path: data/processed/hard_provenance/features.parquet
labels_path: data/processed/hard_provenance/labels.parquet
splits_path: data/processed/hard_provenance/splits.json
output_model_path: data/artifacts/symmetric_sanitizer/models/hybrid.pkl
output_metrics_path: data/artifacts/symmetric_sanitizer/metrics/hybrid_train_metrics.json
random_state: 42
threshold: 0.5
threshold_selection: best_f1_on_val
drop_feature_columns:
  - page_width
  - page_height
  - num_text_objects
  - num_text_outside_page_bounds
  - frac_text_outside_page
  - num_text_negative_coords
  - max_abs_x
  - max_abs_y
  - max_distance_from_page_center
  - mean_distance_from_page_center
  - coord_entropy_x
  - coord_entropy_y
  - bbox_area_mean
  - bbox_area_std
  - quadrant_density_q1
  - quadrant_density_q2
  - quadrant_density_q3
  - quadrant_density_q4
  - coord_variance_x
  - coord_variance_y
  - distance_outlier_score
  - num_render_mode_3
  - frac_render_mode_3
  - num_nonstandard_render_modes
  - num_white_text
  - frac_white_text
  - white_text_on_white_bg_flag
  - num_pages
  - num_content_streams_total
  - mean_streams_per_page
  - std_streams_per_page
  - artifact_bmc_count
  - artifact_emc_count
  - has_artifact_wrapper
  - num_text_show_ops
  - num_stream_objects
  - avg_stream_length_bytes
  - max_stream_length_bytes
  - text_density_per_page
  - injection_cluster_score
hybrid:
  c_values: [1.0]
  max_iter: 4000
  class_weight: balanced
  solver: liblinear
text_tfidf:
  strip_scaffold_block_contents: false
  strip_synthetic_phrase_markers: false
  strip_known_benchmark_wrappers: true
  known_benchmark_wrappers:
    - SYSTEM_POLICY_DO_NOT_REMOVE
    - DOCUMENT_NOTE
    - BEGIN_SYSTEM_POLICY
    - END_SYSTEM_POLICY
    - BEGIN_SYSTEM_PROMPT
    - END_SYSTEM_PROMPT
    - BEGIN_PROMPT_INJECTION
    - END_PROMPT_INJECTION
    - DO_NOT_REMOVE
    - dataset_sample_id
    - message_type
    - sample_id
    - sample
  word_ngram_range: [1, 3]
  char_ngram_range: [3, 5]
  max_features_word: 20000
  max_features_char: 20000
  min_df: 1
  max_df: 0.98
