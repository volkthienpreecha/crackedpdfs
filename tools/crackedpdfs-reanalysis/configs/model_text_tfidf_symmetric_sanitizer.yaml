model_name: text_tfidf
dataset_config: configs/dataset_hard_provenance.yaml
labels_path: data/processed/hard_provenance/labels.parquet
splits_path: data/processed/hard_provenance/splits.json
output_model_path: data/artifacts/symmetric_sanitizer/models/text_tfidf.pkl
output_metrics_path: data/artifacts/symmetric_sanitizer/metrics/text_tfidf_train_metrics.json
random_state: 42
threshold: 0.5
threshold_selection: best_f1_on_val
text_tfidf:
  strip_scaffold_block_contents: false
  strip_synthetic_phrase_markers: false
  strip_known_benchmark_wrappers: true
  known_benchmark_wrappers:
    - SYSTEM_POLICY_DO_NOT_REMOVE
    - DOCUMENT_NOTE
    - BEGIN_SYSTEM_POLICY
    - END_SYSTEM_POLICY
    - BEGIN_SYSTEM_PROMPT
    - END_SYSTEM_PROMPT
    - BEGIN_PROMPT_INJECTION
    - END_PROMPT_INJECTION
    - DO_NOT_REMOVE
    - dataset_sample_id
    - message_type
    - sample_id
    - sample
  c_values: [1.0]
  max_iter: 4000
  class_weight: balanced
  solver: liblinear
  word_ngram_range: [1, 3]
  char_ngram_range: [3, 5]
  max_features_word: 60000
  max_features_char: 60000
  min_df: 1
  max_df: 0.98
