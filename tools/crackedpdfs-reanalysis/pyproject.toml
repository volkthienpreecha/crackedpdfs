[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crackedpdfs-reanalysis"
version = "0.1.0"
description = "Re-analysis of the CrackedPDFs paper v1 detectors under document-and-payload holdout and symmetric sanitization."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2.0",
  "pandas>=2.2.0",
  "pyarrow>=18.0.0",
  "pikepdf>=9.0.0",
  "PyYAML>=6.0.0",
  "scikit-learn>=1.5.0",
  "xgboost>=2.1.0",
  "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
crackedpdfs-reanalysis = "crackedpdfs_reanalysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
