[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crackedpdfs-v2"
version = "0.1.0"
description = "Benchmark v2 corpus builder for CrackedPDFs: content pools, folds, and exact length matching."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "Karthik Subramanian", email = "winnerkarthik07@gmail.com" },
  { name = "Pukaphol Thienpreecha" },
]
dependencies = ["pypdf>=4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
